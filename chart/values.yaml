image:
  repository: rg.nl-ams.scw.cloud/t3000-dev/openchamber
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1.5Gi"

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

secretName: openchamber-secrets

imagePullSecret: ""
