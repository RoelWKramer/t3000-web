image:
  repository: rg.nl-ams.scw.cloud/t3000-dev/openchamber
  tag: latest
  pullPolicy: Always

service:
  port: 3000

ingress:
  enabled: false
  host: ""
  className: ""
  # host defaults to <namespace>.apps.vynder.net (derived in deploy.sh)
  tls: false
  tlsSecretName: ""
  annotations: {}

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1.5Gi"

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

secretName: openchamber-secrets

imagePullSecret: ""
