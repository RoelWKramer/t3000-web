apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: openchamber
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      initContainers:
        - name: init-data
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "=== init: whoami=$(whoami) id=$(id) ==="
              mkdir -p /home/openchamber/.config/opencode
              mkdir -p /home/openchamber/.config/openchamber
              mkdir -p /home/openchamber/.local/share/opencode
              chown -R 1000:1000 /home/openchamber
          volumeMounts:
            - name: data
              mountPath: /home/openchamber
      containers:
        - name: openchamber
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: config
              mountPath: /home/openchamber/.config/opencode/opencode.json
              subPath: opencode.json
            - name: data
              mountPath: /home/openchamber
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
