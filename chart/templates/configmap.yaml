apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "plugin": ["/opt/opencode/plugins/k8s-monitor/index.mjs"],
      "enabled_providers": ["opencode", "opencode-go"],
      "model": "openai/deepseek-v4-pro",
      "small_model": "openai/deepseek-v4-pro",
      "provider": {
        "opencode": {
          "options": {
            "apiKey": "{env:OPENCODE_API_KEY}"
          }
        },
        "opencode-go": {
          "options": {
            "apiKey": "{env:OPENCODE_GO_API_KEY}"
          }
        }
      },
      "references": {
        "opencode-server": {
          "path": "/home/openchamber/opencode-server"
        }
      },
      "server": {
        "port": 4096,
        "hostname": "0.0.0.0"
      },
      "permission": {
        "bash": {
          "*": "ask",
          "git *": "allow",
          "git push *": "ask",
          "npm *": "allow",
          "grep *": "allow"
        }
      }
    }
