apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "references": {
        "opencode-server": {
          "path": "/home/openchamber/opencode-server"
        }
      },
      "server": {
        "port": 4096,
        "hostname": "0.0.0.0"
      },
      "permission": {
        "bash": {
          "*": "ask",
          "git *": "allow",
          "git push *": "ask",
          "npm *": "allow",
          "grep *": "allow"
        }
      }
    }
